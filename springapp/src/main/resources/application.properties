spring.application.name=neo

# Render port binding
server.port=${PORT:8080}

# Aiven MySQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP — 2 connections for 512 MB (each MySQL conn ≈ 5–10 MB native + heap)
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=540000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=0
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.initialization-fail-timeout=0

# Aiven SSL
spring.datasource.hikari.data-source-properties.sslMode=REQUIRED
spring.datasource.hikari.data-source-properties.enabledTLSProtocols=TLSv1.2,TLSv1.3
spring.datasource.hikari.data-source-properties.allowPublicKeyRetrieval=true
spring.datasource.hikari.data-source-properties.serverTimezone=UTC

# JPA / Hibernate — 126 repositories / ~127 entities
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=false
# Cap Hibernate query-plan caches (each entry consumes Metaspace)
spring.jpa.properties.hibernate.query.plan_cache_max_size=32
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=16
# Defer Spring Data repository proxy creation until first use (reduces startup Metaspace spike)
spring.data.jpa.repositories.bootstrap-mode=lazy

# Startup
spring.main.banner-mode=off
spring.jmx.enabled=false

# Tomcat — 25 threads × 512 kB stacks ≈ 13 MB (vs default 200 × 1 MB ≈ 200 MB)
server.tomcat.threads.max=25
server.tomcat.threads.min-spare=2
server.tomcat.max-connections=50
server.tomcat.accept-count=8

# Scheduler + async
spring.task.scheduling.pool.size=2
spring.task.execution.pool.core-size=2
spring.task.execution.pool.max-size=4
spring.task.execution.pool.queue-capacity=16

# CORS
spring.web.cors.allowed-origins=https://neo-bank-669.web.app,https://neo-bank-669.firebaseapp.com,https://fullstack-neobank.onrender.com,http://localhost:4200,http://localhost:4000
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.web.cors.allowed-headers=*
spring.web.cors.allow-credentials=true
spring.web.cors.max-age=3600

# SMTP
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Actuator — health only; disable metric registries that create extra beans
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.show-details=never
management.metrics.export.prometheus.enabled=false
management.metrics.enable.all=false
management.metrics.enable.jvm=false
management.metrics.enable.process=false
management.metrics.enable.system=false
management.metrics.enable.tomcat=false
management.metrics.enable.hikaricp=false
management.health.diskspace.enabled=false

# Swagger / OpenAPI — OFF in production (springdoc still on classpath but auto-config skipped)
springdoc.api-docs.enabled=${SWAGGER_ENABLED:false}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:false}

# Logging
logging.level.root=${LOG_LEVEL_ROOT:WARN}
logging.level.com.neo.springapp=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Multipart
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

app.admin.face-auth-enabled=${ADMIN_FACE_AUTH_ENABLED:false}
app.admin.face-auth-bypass=${ADMIN_FACE_AUTH_BYPASS:false}
