<div class="login-container">
  <div class="login-box">
    <h1 class="brand-name">
      <img src="/favicon.ico" alt="NeoBank Logo" class="brand-logo">
      NEOBANK
    </h1>
    <h2>Corporate Headquarters</h2>

    <ng-container *ngIf="!showCreateAccount; else createCorporateForm">
    <p class="login-caption">Secure access for NeoBank administration</p>

    <form (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Access Role</label>
        <select
          id="role"
          [(ngModel)]="selectedRole"
          name="role"
          required
          class="role-select"
        >
          <option value="ADMIN">Admin</option>
          <option value="MANAGER">Manager</option>
        </select>
      </div>

      <div class="form-group">
        <label>Gmail</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          required
          placeholder="Enter Gmail address"
        />
      </div>

      <div class="form-group">
        <label>Password</label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="Enter password"
        />
      </div>

      <div *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </div>

      <button type="submit" [disabled]="isLoading" class="login-btn">
        <span *ngIf="!isLoading">Login</span>
        <span *ngIf="isLoading">Logging in...</span>
      </button>
    </form>
    <button *ngIf="corporateAccountAvailable" type="button" class="create-account-link" (click)="openCreateAccount()">
      Create Corporate Account
    </button>
    </ng-container>

    <ng-template #createCorporateForm>
      <p class="login-caption">Create the single NeoBank corporate account</p>
      <form (ngSubmit)="createCorporateAccount()">
        <div class="form-group">
          <label>Gmail</label>
          <input type="email" [(ngModel)]="createEmail" name="createEmail" required placeholder="Enter Gmail address" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" [(ngModel)]="createPassword" name="createPassword" required placeholder="Create password" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" [(ngModel)]="confirmCreatePassword" name="confirmCreatePassword" required placeholder="Confirm password" />
        </div>
        <div *ngIf="errorMessage" class="error-message">{{ errorMessage }}</div>
        <button type="submit" [disabled]="isCreatingAccount" class="login-btn">
          {{ isCreatingAccount ? 'Creating account...' : 'Create Corporate Account' }}
        </button>
      </form>
      <button type="button" class="create-account-link" (click)="backToLogin()">Back to Login</button>
    </ng-template>
  </div>
</div>
