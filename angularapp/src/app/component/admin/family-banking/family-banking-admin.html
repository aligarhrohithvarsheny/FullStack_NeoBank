<section class="admin-family"><header><div><p>ADMIN OPERATIONS</p><h1>Family Banking reviews</h1></div><button (click)="load()">Refresh</button></header><p class="notice success" *ngIf="message">{{ message }}</p><p class="notice error" *ngIf="error">{{ error }}</p><div class="review-row" *ngFor="let app of applications"><div><strong>{{ app.minorName }}</strong><span>Guardian #{{ app.guardianUserId }} · DOB {{ app.dateOfBirth }}</span></div><div><span>Daily ₹{{ app.dailyLimit | number:'1.0-0' }} · Monthly ₹{{ app.monthlyLimit | number:'1.0-0' }}</span><button *ngIf="app.status === 'PENDING'" (click)="review(app, true)">Approve</button><button *ngIf="app.status === 'PENDING'" class="quiet" (click)="review(app, false)">Decline</button><b>{{ app.status }}</b></div></div><p *ngIf="!applications.length">No pending applications.</p></section>
