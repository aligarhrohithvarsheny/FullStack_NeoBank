<div class="hod-login-page">
  <div class="hod-login-card">
    <img src="/favicon.ico" alt="NeoBank Logo" class="hod-logo">
    <p class="hod-eyebrow">NeoBank Headquarters</p>
    <h1>HOD Login</h1>
    <p class="hod-caption">Secure access for the Head of Department</p>

    <ng-container *ngIf="!showCreateAccount; else createForm">
      <form (ngSubmit)="login()">
        <label>Gmail</label>
        <input type="email" [(ngModel)]="email" name="email" placeholder="Enter Gmail address" required>
        <label>Password</label>
        <input type="password" [(ngModel)]="password" name="password" placeholder="Enter password" required>
        <p class="hod-error" *ngIf="errorMessage">{{ errorMessage }}</p>
        <button type="submit" [disabled]="isLoading">{{ isLoading ? 'Signing in...' : 'HOD Login' }}</button>
      </form>
      <button *ngIf="showCreateAccountButton" type="button" class="secondary-button create-account-button" (click)="showCreateAccount = true; errorMessage = ''">
        Create HOD Account
      </button>
      <p class="hod-account-note" *ngIf="!showCreateAccountButton">The HOD account has already been created.</p>
      <button type="button" class="secondary-button" (click)="showResetPassword = true; errorMessage = ''">Reset HOD Password</button>
    </ng-container>

    <ng-template #createForm>
      <form (ngSubmit)="createAccount()">
        <label>Gmail</label>
        <input type="email" [(ngModel)]="createEmail" name="createEmail" placeholder="Enter Gmail address" required>
        <label>Password</label>
        <input type="password" [(ngModel)]="createPassword" name="createPassword" placeholder="Create password" required>
        <label>Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Confirm password" required>
        <p class="hod-error" *ngIf="errorMessage">{{ errorMessage }}</p>
        <button type="submit" [disabled]="isCreating">{{ isCreating ? 'Creating...' : 'Create HOD Account' }}</button>
      </form>
      <button type="button" class="secondary-button" (click)="showCreateAccount = false; errorMessage = ''">Back to Login</button>
    </ng-template>

    <section *ngIf="showResetPassword" class="hod-reset-panel">
      <h2>Reset HOD Password</h2>
      <p>Use this separate HOD recovery flow to unlock the account.</p>
      <label>New Password</label>
      <input type="password" [(ngModel)]="createPassword" name="resetPassword" placeholder="Create new password">
      <label>Confirm New Password</label>
      <input type="password" [(ngModel)]="confirmPassword" name="resetConfirmPassword" placeholder="Confirm new password">
      <button type="button" [disabled]="isCreating" (click)="resetPassword()">{{ isCreating ? 'Resetting...' : 'Reset & Unlock HOD' }}</button>
      <button type="button" class="secondary-button" (click)="showResetPassword = false; errorMessage = ''">Cancel</button>
    </section>
  </div>
</div>
